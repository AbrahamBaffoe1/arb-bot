# Public-data evaluation by default. Live mode also requires --enable-live,
# passing funding evidence, authenticated fee checks and funded balances.
mode: paper
venues:
  coinbase:
    enabled: true
    taker_fee: 0.012   # conservative estimate, NOT a verified account tier
    maker_fee: 0.006
  kraken:
    enabled: true
    taker_fee: 0.004
    maker_fee: 0.0025
arb_groups:
  BTC:  {coinbase: 'BTC/USDT', kraken: 'BTC/USDT'}
  ETH:  {coinbase: 'ETH/USDT', kraken: 'ETH/USDT'}
  SOL:  {coinbase: 'SOL/USDT', kraken: 'SOL/USDT'}
  XRP:  {coinbase: 'XRP/USDT', kraken: 'XRP/USDT'}
  DOGE: {coinbase: 'DOGE/USDT', kraken: 'DOGE/USDT'}
  ADA:  {coinbase: 'ADA/USDT', kraken: 'ADA/USDT'}
  LINK: {coinbase: 'LINK/USDT', kraken: 'LINK/USDT'}
triangles:
  kraken:
    - ['BTC/USDT', 'ETH/BTC', 'ETH/USDT']
scanner:
  interval_ms: 200
  min_net_edge: 0.001
  min_profit_usdt: 0.10
  slippage_buffer: 0.0005
  rebalance_buffer: 0.001
  book_depth: 25
  stale_book_ms: 1500
  max_book_skew_ms: 750
  confirmation_ms: 600
  window_gap_s: 3
  sizes_usdt: [10, 15, 25]
  triangular_enabled: false  # three sequential legs require separate live validation
risk:
  trade_notional_usdt: 25
  max_daily_loss_usdt: 10
  max_open_skew_usdt: 100
  cooldown_s: 3
  kill_switch_file: data/KILL
paper:
  starting_balance_usdt: 500
  inventory_fraction: 0.5
funding:
  min_observation_hours: 72
  min_paper_fills: 100
  min_days_with_fills: 7
  min_net_pnl_usdt: 10
  fee_max_age_hours: 720
  evidence_max_age_hours: 24
  pilot_cash_reserve_usdt: 10
live:
  disconnect_guard_enabled: true  # live-only; Kraken timer applies to all account orders
  max_trade_usdt: 25
  max_quote_age_ms: 1000
storage:
  db_path: data/research-v2.db
  live_db_path: data/live.db
economics:
  operating_cost_usdt_per_day: 0  # set your actual hosting/operating allocation; no cost assumed for this local evaluation
portfolio:
  max_drawdown_fraction: 0.05
  max_asset_exposure_usdt: 200
  max_venue_exposure_usdt: 650
  min_cash_fraction: 0.20
  rebalance_trigger_usdt: 25
recording:
  db_path: data/market-tape.db
  queue_capacity: 20000
  max_disk_gb: 56  # measured about 45 GiB for four days, plus headroom
  min_free_disk_gb: 20
  trades: true
research:
  discovery_quotes: [USDT, USD]
  max_discovery_markets: 100
  max_unhedged_usdt: 0.01
operations:
  heartbeat_file: data/heartbeat.json
  watchdog_enabled: true
  watchdog_max_age_s: 15
  max_event_loop_lag_ms: 1000
  alert_cooldown_s: 60
  backup_dir: data/backups
  backup_interval_hours: 6
  max_backup_disk_gb: 24  # preserve existing backups and alert when capacity is reached
dashboard:
  host: 127.0.0.1
  port: 8421
